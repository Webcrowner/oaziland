# Oaziland — full production stack for a self-managed VPS (e.g. Contabo).
#
# WHY this file exists: Docker Compose lets one command
# (`docker compose up -d`) start every piece this platform needs —
# the database, the cache, the backend, the web app, and the reverse
# proxy — all correctly wired together, without hand-installing and
# configuring five separate pieces of server software individually.
#
# HOW TO USE THIS: see DEPLOYMENT_VPS.md in this same folder for the
# full, exact, copy-paste procedure. This file alone is not enough —
# you also need a real .env file (never commit it) with your actual
# secrets, and a real domain pointed at this server's IP address.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oaziland
      POSTGRES_USER: oaziland
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume, not a bind mount — Docker manages this storage
      # location itself, and it survives `docker compose down` (only
      # `docker compose down -v` would delete it) so your real data
      # is never lost by an ordinary restart or redeploy.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaziland"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # WHY these two are set here rather than left to .env alone:
      # they must point at the OTHER CONTAINERS by their Compose
      # service name ("postgres", "redis") — not localhost, and not
      # whatever value a copy-pasted .env.example might have.
      DATABASE_URL: postgres://oaziland:${POSTGRES_PASSWORD}@postgres:5432/oaziland
      REDIS_URL: redis://redis:6379/0
    volumes:
      # A real, persistent home for uploaded media files (property
      # photos, etc.) — without this volume, anything uploaded would
      # be lost the next time the backend container is rebuilt.
      - media_data:/app/media
      - static_data:/app/staticfiles
      # Private files served only through permission-checked endpoints (course PDFs and videos, learners'
      # assignment submissions, compliance documents) — kept apart from media_data, which nginx serves publicly.
      - private_media_data:/app/private_media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Hourly background sweep for Taskln jobs: expires unaccepted requests, removes
  # technicians who never quote or never show up (refunding held payment), and
  # releases payment on finished jobs the client never confirmed. Without this
  # container none of those automatic rules ever run. It also reminds learners who've gone quiet on a course
  # (send_course_reminders sends each learner at most one reminder a week, however often it runs).
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://oaziland:${POSTGRES_PASSWORD}@postgres:5432/oaziland
      REDIS_URL: redis://redis:6379/0
    command: sh /app/run_scheduler.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Nightly database backup: a compressed dump into the backup_data volume, keeping the last 14. This protects against
  # mistakes and corruption, NOT against losing the server: also copy the dumps off the machine (for example with
  # `docker compose cp backup:/backups ./offsite` on a schedule). Restore with `pg_restore -d oaziland <file>`.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: oaziland
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: oaziland
    volumes:
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file=/backups/oaziland-$$(date -u +%Y%m%d-%H%M).dump || echo "backup failed"
          ls -1t /backups/oaziland-*.dump | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Baked in at BUILD time, not runtime — see web/Dockerfile's
        # own comment on why this differs from the backend's env vars.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      # Server-side rendering talks to Django over the compose network; "localhost" inside this container is Next.js itself.
      API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - web

  # WHY certbot is its OWN container rather than something installed
  # inside nginx's container: it only needs to run periodically (to
  # renew the SSL certificate before it expires), not continuously —
  # keeping it separate means it can't interfere with nginx staying up.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
  backup_data:
  redis_data:
  media_data:
  private_media_data:
  static_data:
  certbot_certs:
  certbot_www:
