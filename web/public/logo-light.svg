  <polygon points="15,0 32,14 -2,14" fill="#C9A227"/>
  <rect x="19" y="22" width="8" height="16" fill="#1B2A4A"/>
  <text x="42" y="32" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">OAZI</text>
  <text x="100" y="32" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#C9A227">LAND</text>
</svg>
