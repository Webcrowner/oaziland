# STEP 2 of 2 — the real, final config, used once a real SSL
# certificate exists (see nginx.initial.conf's own comment, and
# DEPLOYMENT_VPS.md, for why there are two files and which order to
# use them in).
#
# Routes:
#   /api/, /admin/, /health/  -> the Django backend container
#   everything else           -> the Next.js web container
# This is the same split a real production deployment on Railway/
# Vercel would have as two separate domains — here it's one domain,
# split by path, which is the standard pattern for a single-VPS setup.

events {
    worker_connections 1024;
}

http {
    # Abuse limits per client address (the backend adds its own per-user limits on top): a generous general budget for
    # the API, and a tight one for sign-in, registration, password-reset and code endpoints.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # Redirect ALL plain HTTP traffic to HTTPS — a real production
    # site should never serve sensitive flows (login, payments) over
    # an unencrypted connection.
    server {
        listen 80;
        server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Only the upload endpoints need the 500 MB video limit enforced by the backend; everything else is small.
        client_max_body_size 2M;

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            client_max_body_size 500M;
            proxy_pass http://backend:8000;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sign-in, registration, password reset and one-time codes: a handful of attempts a minute per address.
        location ~ ^/api/auth/(login/|register/|password-reset/|mfa/) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://backend:8000;
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        # Uploaded files are served as inert downloads: never executed or rendered as a page, whatever they contain.
        location /media/ {
            alias /app/media/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
