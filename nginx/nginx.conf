# STEP 2 of 2 — the real, final config, used once a real SSL
# certificate exists (see nginx.initial.conf's own comment, and
# DEPLOYMENT_VPS.md, for why there are two files and which order to
# use them in).
#
# Routes:
#   /api/, /admin/, /health/  -> the Django backend container
#   everything else           -> the Next.js web container
# This is the same split a real production deployment on Railway/
# Vercel would have as two separate domains — here it's one domain,
# split by path, which is the standard pattern for a single-VPS setup.

events {
    worker_connections 1024;
}

http {
    # Redirect ALL plain HTTP traffic to HTTPS — a real production
    # site should never serve sensitive flows (login, payments) over
    # an unencrypted connection.
    server {
        listen 80;
        server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

        client_max_body_size 20M;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/ {
            proxy_pass http://backend:8000;
        }

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
