# STEP 1 of 2 — the initial, HTTP-only config.
#
# WHY this file exists separately from nginx.conf: getting an SSL
# certificate from Certbot requires Nginx to already be running and
# reachable on plain HTTP first (Certbot proves you own the domain by
# serving a file over HTTP) — but the FINAL config wants to redirect
# all HTTP traffic straight to HTTPS. Those two requirements conflict
# on the very first run, before any certificate exists yet. This file
# is the one-time bootstrap: plain HTTP only, just enough for Certbot
# to succeed. Once you have a real certificate (see DEPLOYMENT_VPS.md
# Step 7), you switch to the real nginx.conf and never need this file
# again.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

        # This is the exact path Certbot's HTTP-01 challenge writes
        # a real file into to prove domain ownership.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "Oaziland is being set up — SSL certificate issuance in progress.";
            add_header Content-Type text/plain;
        }
    }
}
